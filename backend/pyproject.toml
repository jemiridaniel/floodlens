[project]
name = "floodlens"
version = "0.1.0"
description = "Flood-risk checks on loan collateral for African microfinance lenders"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "httpx>=0.27",
    "openai>=1.40",
    "meta_sam_parser>=0.1",
    "numpy>=1.26",
    "scipy>=1.12",
    "rasterio>=1.3.10",
    "pyproj>=3.6",
    "pystac-client>=0.8",
    "planetary-computer>=1.0",
    "Pillow>=10.3",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
